<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- Production builds insert a Content-Security-Policy <meta> here (vite.config.ts). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Combat Map</title>
    <script>
      // Before first paint: the player window is always black; the DM window applies
      // its saved theme (dark by default). Mirrors src/app/theme.ts and src/app/App.tsx.
      try {
        var d = document.documentElement
        if (location.hash.indexOf('#/player') === 0) {
          d.dataset.view = 'player'
        } else {
          var t = localStorage.getItem('vtt:theme')
          if (t === 'light' || t === 'dark') d.dataset.theme = t
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
